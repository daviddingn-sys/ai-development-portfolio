name: "Custom Web App / 定制开发需求"
description: "Request a quote for a small web app, dashboard or automation / 咨询Web应用、数据看板与自动化开发"
title: "[Project Inquiry / 项目咨询] "
labels: ["inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest. Do not include passwords, private data, ID numbers or API keys in this public issue.
        感谢咨询。此页面为公开Issue，请勿填写密码、身份证件号码、客户敏感数据或API密钥。
  - type: dropdown
    id: category
    attributes:
      label: "Project category / 项目类型"
      options:
        - "Business web app / 业务管理系统"
        - "Dashboard & reports / 数据看板与报表"
        - "Education portal / 教育信息平台"
        - "Workflow automation / 流程自动化"
        - "Other / 其他"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "Business problem / 想解决什么问题"
      description: "Outline the workflow and target users / 描述业务流程和使用对象"
      placeholder: "We need a lightweight system to..."
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: "Must-have features / 必备功能"
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: "Target delivery / 期望交付时间"
      options:
        - "Within 2 weeks / 两周内"
        - "2–4 weeks / 2–4周"
        - "1–3 months / 1–3个月"
        - "Flexible / 可协商"
  - type: dropdown
    id: budget
    attributes:
      label: "Indicative budget / 预算范围"
      options:
        - "To be discussed / 待沟通"
        - "Under USD 500 / 低于500美元"
        - "USD 500–1500 / 500–1500美元"
        - "USD 1500–5000 / 1500–5000美元"
        - "USD 5000+ / 5000美元以上"
  - type: textarea
    id: other
    attributes:
      label: "Other constraints / 其他要求（可选）"
      description: "Please share only non-sensitive information / 仅填写非敏感信息"
